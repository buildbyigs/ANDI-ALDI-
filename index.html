         <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PENGENALAN RANTAI PASOK (SUPPLY CHAIN)</title>
    <style>
        /* ============================================================
           1. RESET & VARIABLES (WHITE + BLUE PROFESSIONAL THEME)
           ============================================================ */
        :root {
            --bg-page: #F8FAFC;
            --bg-header: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --brand-blue: #0284C7;
            --brand-blue-hover: #0369A1;
            --brand-blue-light: #F0F9FF;
            --brand-blue-border: #BAE6FD;
            --border-light: #E2E8F0;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
            --shadow-overlay: 0 20px 40px -10px rgba(15, 23, 42, 0.25);
            --radius-main: 16px;
            --radius-button: 10px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Background Subtle Decorative Accent */
        body::before {
            content: "";
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.05) 0%, rgba(248, 250, 252, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           2. LAYOUT APP CONTAINER
           ============================================================ */
        #app {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            overflow: hidden;
        }

        /* ============================================================
           3. HEADER SECTION
           ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-header);
            padding: clamp(0.6rem, 1.2vh, 1rem) clamp(1rem, 3vw, 2.5rem);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-subtle);
            z-index: 10;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title {
            font-size: clamp(0.85rem, 1.4vw, 1.1rem);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .header-subtitle {
            font-size: clamp(0.65rem, 1vw, 0.8rem);
            font-weight: 700;
            color: var(--brand-blue);
            background: var(--brand-blue-light);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--brand-blue-border);
            text-transform: uppercase;
        }

        .header-meta {
            font-size: clamp(0.7rem, 0.9vw, 0.85rem);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-counter {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(0.9rem, 1.3vw, 1.15rem);
            font-weight: 700;
            color: var(--brand-blue);
            background: var(--brand-blue-light);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--brand-blue-border);
        }

        /* ============================================================
           4. MAIN PRESENTATION AREA (STAGE)
           ============================================================ */
        .presentation-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 1.5vh, 1.2rem) clamp(0.8rem, 2vw, 2rem);
            gap: clamp(0.5rem, 1.2vh, 1rem);
            overflow: hidden;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* SLIDE IMAGE FRAME (DOMINANT LANDSCAPE 16:9) */
        .slide-frame {
            position: relative;
            width: 100%;
            max-width: calc((100vh - 220px) * (16 / 9));
            aspect-ratio: 16 / 9;
            background: #FFFFFF;
            border-radius: var(--radius-main);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--transition-smooth);
        }

        .slide-frame-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-img-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            opacity: 0;
            transition: opacity 0.3s var(--transition-smooth);
        }

        .slide-img-element.loaded {
            opacity: 1;
        }

        /* Fallback Error Minimalis dalam Frame */
        .slide-error-fallback {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #FEF2F2;
            color: #991B1B;
            padding: 1rem;
            text-align: center;
        }

        .slide-error-fallback.active {
            display: flex;
        }

        .slide-error-fallback span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .slide-error-fallback code {
            font-size: 0.75rem;
            background: #FEE2E2;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        /* ============================================================
           5. SLIDE INFORMATION (TEKS DI LUAR FRAME GAMBAR)
           ============================================================ */
        .slide-info-container {
            width: 100%;
            max-width: calc((100vh - 220px) * (16 / 9));
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: clamp(0.5rem, 1.2vh, 0.8rem) clamp(0.8rem, 1.5vw, 1.2rem);
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            text-align: left;
        }

        .slide-info-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slide-number-badge {
            font-size: clamp(0.7rem, 0.9vw, 0.8rem);
            font-weight: 800;
            color: var(--brand-blue);
            background: var(--brand-blue-light);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .slide-info-title {
            font-size: clamp(0.85rem, 1.2vw, 1.05rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .slide-info-desc {
            font-size: clamp(0.75rem, 1vw, 0.9rem);
            color: var(--text-secondary);
            line-height: 1.35;
        }

        .slide-info-desc ul {
            margin-left: 1.2rem;
            margin-top: 0.2rem;
        }

        .slide-info-desc li {
            margin-bottom: 0.1rem;
        }

        /* ============================================================
           6. FOOTER & NAVIGATION
           ============================================================ */
        .app-footer {
            background: var(--bg-header);
            border-top: 1px solid var(--border-light);
            padding: clamp(0.5rem, 1.2vh, 0.8rem) clamp(1rem, 3vw, 2.5rem);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 10;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 4px;
            background: #E2E8F0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: var(--brand-blue);
            transition: width 0.3s var(--transition-smooth);
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-nav {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            height: 38px;
            padding: 0 0.9rem;
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-size: clamp(0.75rem, 0.9vw, 0.85rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--brand-blue-light);
            border-color: var(--brand-blue-border);
            color: var(--brand-blue);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-nav svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           7. OVERVIEW OVERLAY
           ============================================================ */
        .overview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: clamp(1rem, 2vw, 2rem);
        }

        .overview-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .overview-modal {
            background: #FFFFFF;
            border-radius: var(--radius-main);
            width: 100%;
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-overlay);
        }

        .overview-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .overview-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-light);
            background: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .btn-close:hover {
            background: var(--bg-page);
            color: var(--text-primary);
        }

        .overview-grid {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .overview-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            cursor: pointer;
            border-radius: 10px;
            padding: 0.5rem;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            background: var(--bg-page);
        }

        .overview-item:hover, .overview-item.active {
            border-color: var(--brand-blue);
            background: var(--brand-blue-light);
        }

        .overview-thumb-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            overflow: hidden;
            background: #FFFFFF;
            border: 1px solid var(--border-light);
        }

        .overview-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overview-item-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           8. DEBUG PANEL
           ============================================================ */
        #debug-panel {
            display: none;
            position: fixed;
            bottom: 70px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            color: #38BDF8;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 1rem;
            border-radius: 8px;
            z-index: 999;
            max-width: 300px;
            box-shadow: var(--shadow-overlay);
        }

        #debug-panel h4 {
            color: #FFFFFF;
            margin-bottom: 0.5rem;
        }

        /* ============================================================
           9. MOBILE RESPONSIVE OPTIMIZATIONS
           ============================================================ */
        @media (max-width: 640px) {
            .app-header {
                padding: 0.6rem 0.8rem;
            }

            .header-subtitle {
                display: none;
            }

            .btn-text {
                display: none;
            }

            .btn-nav {
                padding: 0;
                width: 38px;
            }

            .presentation-stage {
                padding: 0.5rem;
                justify-content: center;
            }

            .slide-frame {
                max-width: 100%;
            }

            .slide-info-container {
                max-width: 100%;
            }

            .app-footer {
                padding: 0.5rem 0.8rem;
                padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-info">
                <div class="header-title-group">
                    <span class="header-title">PENGENALAN RANTAI PASOK</span>
                    <span class="header-subtitle">SUPPLY CHAIN</span>
                </div>
                <div class="header-meta">ANDI ALDI RESKKY · XE · MPLB 01</div>
            </div>
            <div class="header-counter" id="slide-counter">01 / 10</div>
        </header>

        <!-- MAIN PRESENTATION STAGE -->
        <main class="presentation-stage" id="presentation-stage">
            <!-- LANDSCAPE 16:9 IMAGE FRAME -->
            <div class="slide-frame">
                <div class="slide-frame-viewport">
                    <img id="main-slide-img" class="slide-img-element" src="" alt="Slide Presentation">
                    <div id="slide-error" class="slide-error-fallback">
                        <span>Gambar Slide Tidak Dapat Dimuat</span>
                        <code id="error-path">./1.jpeg</code>
                    </div>
                </div>
            </div>

            <!-- SLIDE INFORMATION (DI LUAR FRAME GAMBAR) -->
            <div class="slide-info-container">
                <div class="slide-info-header">
                    <span class="slide-number-badge" id="info-badge">SLIDE 01</span>
                    <h2 class="slide-info-title" id="info-title">Judul Slide</h2>
                </div>
                <div class="slide-info-desc" id="info-desc">
                    Deskripsi slide akan tampil di sini.
                </div>
            </div>
        </main>

        <!-- FOOTER & CONTROLS -->
        <footer class="app-footer">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="nav-controls">
                <div class="nav-group">
                    <button class="btn-nav" id="btn-prev" aria-label="Slide Sebelumnya">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                        <span class="btn-text">Sebelumnya</span>
                    </button>
                    <button class="btn-nav" id="btn-next" aria-label="Slide Selanjutnya">
                        <span class="btn-text">Selanjutnya</span>
                        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div class="nav-group">
                    <button class="btn-nav" id="btn-overview" aria-label="Overview Slide">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        <span class="btn-text">Overview</span>
                    </button>
                    <button class="btn-nav" id="btn-fullscreen" aria-label="Layar Penuh">
                        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                        <span class="btn-text">Layar Penuh</span>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- OVERVIEW OVERLAY -->
    <div class="overview-overlay" id="overview-overlay">
        <div class="overview-modal">
            <div class="overview-header">
                <div class="overview-title">Overview Slide Presentasi</div>
                <button class="btn-close" id="btn-close-overview" aria-label="Tutup Overview">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="overview-grid" id="overview-grid">
                <!-- Grid items generated by JS -->
            </div>
        </div>
    </div>

    <!-- DEBUG PANEL -->
    <div id="debug-panel">
        <h4>IMAGE LOADER DEBUG</h4>
        <div id="debug-list"></div>
    </div>

    <script>
        /* ============================================================
           1. DATA CONFIGURATION & SLIDE CONTENT
           ============================================================ */
        const PRESENTATION_DATA = [
            {
                id: 1,
                image: "./1.jpeg",
                title: "PENGENALAN RANTAI PASOK",
                subtitle: "Supply Chain",
                desc: "Memahami dasar-dasar pergerakan produk dari tahap awal hingga konsumen akhir."
            },
            {
                id: 2,
                image: "./2.jpeg",
                title: "PENGERTIAN RANTAI PASOK",
                desc: "Rantai pasok menghubungkan berbagai pihak dalam proses penyediaan dan distribusi produk."
            },
            {
                id: 3,
                image: "./3.jpeg",
                title: "TUJUAN RANTAI PASOK",
                desc: `<ul>
                        <li>Menjamin ketersediaan produk</li>
                        <li>Memperlancar distribusi</li>
                        <li>Mengurangi biaya dan waktu</li>
                        <li>Meningkatkan efisiensi</li>
                        <li>Memenuhi kebutuhan konsumen</li>
                       </ul>`
            },
            {
                id: 4,
                image: "./4.jpeg",
                title: "ALUR RANTAI PASOK",
                desc: "Bahan Baku → Supplier → Produksi → Gudang → Distribusi → Toko/Penjual → Konsumen"
            },
            {
                id: 5,
                image: "./5.jpeg",
                title: "PIHAK YANG TERLIBAT",
                desc: `<ul>
                        <li>Supplier</li>
                        <li>Produsen</li>
                        <li>Gudang</li>
                        <li>Distributor</li>
                        <li>Retailer</li>
                        <li>Konsumen</li>
                       </ul>`
            },
            {
                id: 6,
                image: "./6.jpeg",
                title: "TIGA BAGIAN RANTAI PASOK",
                desc: "1. UPSTREAM / HULU &nbsp;|&nbsp; 2. INTERNAL &nbsp;|&nbsp; 3. DOWNSTREAM / HILIR"
            },
            {
                id: 7,
                image: "./7.jpeg",
                title: "ALIRAN DALAM RANTAI PASOK",
                desc: "• Material Flow &nbsp;&nbsp;• Information Flow &nbsp;&nbsp;• Financial Flow"
            },
            {
                id: 8,
                image: "./8.jpeg",
                title: "CONTOH RANTAI PASOK",
                desc: "<strong>Contoh Air Mineral:</strong><br>Sumber Bahan → Supplier → Pabrik → Gudang → Distributor → Toko → Konsumen"
            },
            {
                id: 9,
                image: "./9.jpeg",
                title: "MANFAAT RANTAI PASOK",
                desc: `<ul>
                        <li>Memperlancar distribusi & mengontrol persediaan</li>
                        <li>Mengurangi pemborosan, menghemat waktu dan biaya</li>
                        <li>Menjaga ketersediaan produk & meningkatkan pelayanan konsumen</li>
                       </ul>`
            },
            {
                id: 10,
                image: "./10.jpeg",
                title: "KESIMPULAN",
                desc: "Rantai pasok menghubungkan supplier, produsen, gudang, distributor, penjual, hingga konsumen melalui aliran material, informasi, dan keuangan."
            }
        ];

        /* ============================================================
           2. STATE MANAGEMENT & DOM ELEMENTS
           ============================================================ */
        let currentIndex = 0;
        const totalSlides = PRESENTATION_DATA.length;

        const mainSlideImg = document.getElementById("main-slide-img");
        const slideError = document.getElementById("slide-error");
        const errorPath = document.getElementById("error-path");
        const slideCounter = document.getElementById("slide-counter");
        const infoBadge = document.getElementById("info-badge");
        const infoTitle = document.getElementById("info-title");
        const infoDesc = document.getElementById("info-desc");
        const progressFill = document.getElementById("progress-fill");

        const btnPrev = document.getElementById("btn-prev");
        const btnNext = document.getElementById("btn-next");
        const btnOverview = document.getElementById("btn-overview");
        const btnFullscreen = document.getElementById("btn-fullscreen");
        const btnCloseOverview = document.getElementById("btn-close-overview");
        const overviewOverlay = document.getElementById("overview-overlay");
        const overviewGrid = document.getElementById("overview-grid");

        /* ============================================================
           3. CORE ENGINE & RENDERER
           ============================================================ */
        function initApp() {
            preloadImages();
            renderSlide(currentIndex);
            buildOverviewGrid();
            setupEventListeners();
            checkDebugMode();
        }

        function renderSlide(index) {
            const data = PRESENTATION_DATA[index];

            // Reset image view & error fallback
            mainSlideImg.classList.remove("loaded");
            slideError.classList.remove("active");

            // Set source
            mainSlideImg.src = data.image;
            mainSlideImg.alt = `Slide ${data.id} - ${data.title}`;

            mainSlideImg.onload = () => {
                mainSlideImg.classList.add("loaded");
                logDebug(data.image, true);
            };

            mainSlideImg.onerror = () => {
                errorPath.textContent = data.image;
                slideError.classList.add("active");
                logDebug(data.image, false);
            };

            // Render Text Outside Frame
            infoBadge.textContent = `SLIDE ${String(data.id).padStart(2, '0')}`;
            infoTitle.textContent = data.title;
            infoDesc.innerHTML = data.desc;

            // Render UI States
            slideCounter.textContent = `${String(data.id).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
            progressFill.style.width = `${((index + 1) / totalSlides) * 100}%`;

            btnPrev.disabled = index === 0;
            btnNext.disabled = index === totalSlides - 1;

            updateOverviewActiveState();
        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentIndex = index;
                renderSlide(currentIndex);
            }
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                goToSlide(currentIndex + 1);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        }

        /* ============================================================
           4. PRELOADING SYSTEM
           ============================================================ */
        function preloadImages() {
            PRESENTATION_DATA.forEach(slide => {
                const img = new Image();
                img.src = slide.image;
            });
        }

        /* ============================================================
           5. OVERVIEW SYSTEM
           ============================================================ */
        function buildOverviewGrid() {
            overviewGrid.innerHTML = "";
            PRESENTATION_DATA.forEach((slide, idx) => {
                const item = document.createElement("div");
                item.className = `overview-item ${idx === currentIndex ? 'active' : ''}`;
                item.onclick = () => {
                    goToSlide(idx);
                    closeOverview();
                };

                item.innerHTML = `
                    <div class="overview-thumb-frame">
                        <img class="overview-thumb-img" src="${slide.image}" alt="${slide.title}">
                    </div>
                    <div class="overview-item-title">${slide.id}. ${slide.title}</div>
                `;
                overviewGrid.appendChild(item);
            });
        }

        function updateOverviewActiveState() {
            const items = overviewGrid.querySelectorAll(".overview-item");
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add("active");
                } else {
                    item.classList.remove("active");
                }
            });
        }

        function openOverview() {
            overviewOverlay.classList.add("active");
        }

        function closeOverview() {
            overviewOverlay.classList.remove("active");
        }

        /* ============================================================
           6. FULLSCREEN SYSTEM
           ============================================================ */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        /* ============================================================
           7. EVENT LISTENERS (KEYBOARD & TOUCH SWIPE)
           ============================================================ */
        function setupEventListeners() {
            btnPrev.addEventListener("click", prevSlide);
            btnNext.addEventListener("click", nextSlide);
            btnOverview.addEventListener("click", openOverview);
            btnCloseOverview.addEventListener("click", closeOverview);
            btnFullscreen.addEventListener("click", toggleFullscreen);

            // Keyboard Navigation
            window.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight" || e.key === "Space" || e.key === " ") {
                    e.preventDefault();
                    nextSlide();
                } else if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    prevSlide();
                } else if (e.key === "Home") {
                    e.preventDefault();
                    goToSlide(0);
                } else if (e.key === "End") {
                    e.preventDefault();
                    goToSlide(totalSlides - 1);
                } else if (e.key === "Escape") {
                    closeOverview();
                }
            });

            // Touch Swipe Handling
            let touchStartX = 0;
            let touchStartY = 0;
            const stage = document.getElementById("presentation-stage");

            stage.addEventListener("touchstart", (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            stage.addEventListener("touchend", (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                // Memastikan gerakan swipe horizontal dominan
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                    if (diffX < 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            }, { passive: true });
        }

        /* ============================================================
           8. DEBUG MODE (?debug=1)
           ============================================================ */
        function checkDebugMode() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("debug") === "1") {
                document.getElementById("debug-panel").style.display = "block";
            }
        }

        function logDebug(path, isSuccess) {
            const debugList = document.getElementById("debug-list");
            if (debugList) {
                const item = document.createElement("div");
                item.style.color = isSuccess ? "#4ADE80" : "#F87171";
                item.textContent = `${path} : ${isSuccess ? '✓ LOADED' : '✕ FAILED'}`;
                debugList.appendChild(item);
            }
        }

        // Initialize Application
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
